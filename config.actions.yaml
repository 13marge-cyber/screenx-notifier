# ============================================================
#  GitHub Actions 전용 설정 (백업 감시용)
# ============================================================
#  이 파일은 리포에 커밋되므로 비밀값을 넣지 마세요.
#  봇 토큰과 채팅 ID는 리포 Secrets에서 환경변수로 주입됩니다.
#    TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_IDS
#
#  Actions는 cron 최소 간격이 5분이고 실제로는 더 지연될 수 있어
#  1분 감시가 가능한 상시 서버(Oracle VM)의 백업 역할입니다.
# ============================================================

telegram:
  bot_token: "SET_VIA_ENV"
  chat_ids: []
  language: "ko"

watchers:
  - name: "CGV 용산 ScreenX 스파이더맨 (Actions 백업)"
    type: "cgv"
    enabled: true
    interval_minutes: 5
    settings:
      theater_code: "0013"
      hall_keywords:
        - "ScreenX"
      movie_keywords:
        - "스파이더맨"

      # Actions는 실행마다 프로세스가 새로 뜨므로 부분 스캔이 무의미합니다.
      # 매 실행에서 감시 날짜 전체를 확인합니다.
      priority_dates: []
      watch_dates:
        - "2026-08-05"
        - "2026-08-06"
        - "2026-08-07"
        - "2026-08-08"
        - "2026-08-09"
        - "2026-08-10"
        - "2026-08-11"
        - "2026-08-12"
        - "2026-08-13"
        - "2026-08-14"
        - "2026-08-15"
      full_scan_every: 1
      request_delay: 0.3

      open_mode: "both"
      web_url: "https://cgv.co.kr/mem/login?returnUrl=%2Fcnm%2FmovieBook%2Fcinema"
      app_store_url: "https://apps.apple.com/kr/app/cgv/id388521649"

advanced:
  # data/state/*.json은 .gitignore에 걸려 있어 커밋이 안 됩니다.
  # Actions는 커밋 가능한 별도 경로를 사용합니다.
  state_dir: "./data/actions-state"
  log_level: "INFO"
  max_retries: 3
  cooldown_minutes: 60
