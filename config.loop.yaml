# 영화 예매 알리미 v5.0.1 — CGV IMAX + 메가박스 DOLBY CINEMA
# 모든 사용자 표시 시간은 코드에서 Asia/Seoul(KST)로 고정합니다.
# Telegram 비밀값은 GitHub Secrets에서만 읽습니다.
# 필요 Secret: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_IDS (개인 chat id 정확히 1개)

telegram: {}

monitor:
  interval_seconds: 60
  failure_alert_threshold: 3
  state_dir: "./data/notifier-state"
  legacy_state_dirs:
    - "./data/v3-state"
    - "./data/actions-state"
  heartbeat:
    enabled: true
    time: "09:00"

cgv:
  timeout_seconds: 6
  request_delay_seconds: 0.2
  circuit_breaker_failures: 3

megabox:
  timeout_seconds: 8
  request_delay_seconds: 0.3
  circuit_breaker_failures: 3
  # selftest는 현재부터 이 범위에서 비어 있지 않은 상영표를 하나 찾아
  # playSchdlNo + 상영관 식별 필드까지 실제 응답으로 검증합니다.
  schema_probe_days: 4
  # 운영 중에도 5분마다 현재/근일 비어 있지 않은 상영표를 canary로 확인합니다.
  runtime_canary_interval_seconds: 300

log_level: "INFO"

watchers:
  - id: "cgv_yongsan_odyssey_imax_20260829_30"
    name: "CGV 용산 IMAX · 오디세이 · 8/29-30"
    enabled: true
    provider: "cgv"
    theater_code: "0013"
    theater_name: "용산아이파크몰"
    alert_title: "용산 IMAX"
    hall_keywords: ["IMAX", "아이맥스"]
    movie_keywords: ["오디세이"]
    dates:
      - "2026-08-29"
      - "2026-08-30"

  - id: "cgv_cheonho_odyssey_imax_20260829_30"
    name: "CGV 천호 IMAX · 오디세이 · 8/29-30"
