name: ScreenX 예매 오픈 감시

# cron 자동 실행은 제거했습니다.
# watch-loop.yml이 같은 상태 디렉터리(data/actions-state)로 1분 감시를 하므로,
# 이 워크플로가 함께 돌면 중복 알림과 상태 커밋 경합이 생깁니다.
# 지금은 단발 점검용 수동 실행만 남겨둡니다.
on:
  workflow_dispatch:

# 감지 상태(data/state)를 리포에 커밋해 실행 간에 유지합니다.
permissions:
  contents: write

concurrency:
  # 앞선 실행이 아직 돌고 있으면 중복 실행하지 않습니다.
  group: screenx-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        # Selenium은 더 이상 필요 없습니다 (CGV JSON API 직접 호출).
        run: pip install --quiet "python-telegram-bot[job-queue]>=22.0" pyyaml requests beautifulsoup4

      - name: 예매 오픈 확인 및 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python main.py --once --config config.actions.yaml

      - name: 감지 상태 저장
        # 상태가 안 남으면 다음 실행이 다시 기준선을 잡아 알림을 놓칩니다.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/actions-state
          if git diff --staged --quiet; then
            echo "상태 변화 없음 - 커밋 생략"
          else
            git commit -m "chore: 감지 상태 갱신"
            git push
          fi
