name: ScreenX v4 1분 감시 루프

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: screenx-watch-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - name: 최신 main 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.11.15 준비
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python --version
          python -m pip freeze

      - name: 사전 점검
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python main.py --config config.loop.yaml preflight

      - name: 후속 실행 1개 선예약
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ok=0
          for attempt in 1 2 3; do
            gh workflow run watch-loop.yml --repo "${{ github.repository }}" --ref main
            rc=$?
            if [ "$rc" -eq 0 ]; then
              ok=1
              echo "후속 실행 예약 성공"
              break
            fi
            echo "::warning::후속 실행 예약 실패 (${attempt}/3), 5초 후 재시도"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::후속 실행을 예약하지 못했습니다. watchdog이 복구를 시도합니다."
          fi
          exit 0

      - name: 1분 감시 (내부 315분 / 외부 325분 제한)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          # Python 내부 종료 + GNU timeout + Actions job timeout의 3중 안전장치.
          timeout --signal=TERM --kill-after=60s 325m \
            python main.py --config config.loop.yaml monitor --runtime-minutes 315

      - name: 상태 체크포인트 커밋
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notifier-state/
          if git diff --cached --quiet; then
            echo "상태 변경 없음"
            exit 0
          fi
          git commit -m "chore: notifier state checkpoint [skip ci]"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              echo "::error::상태 체크포인트 rebase 실패 - 자동 병합하지 않습니다."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "상태 체크포인트 push 성공"
              exit 0
            fi
            echo "::warning::상태 체크포인트 push 실패 (${attempt}/3), 3초 후 최신 main 재동기화"
            sleep 3
          done
          echo "::error::상태 체크포인트 push가 3회 모두 실패했습니다."
          exit 1

      - name: 비정상 종료 백오프
        if: failure() && !cancelled()
        run: |
          echo "치명적 오류 재실행 폭주 방지를 위해 5분 대기합니다."
          sleep 300
